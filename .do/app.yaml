# DigitalOcean App Platform spec. App Platform disks are temporary: data (accounts, missions, photos) resets on every deploy.
# That is fine for a demo; for real use run the docker-compose setup in deploy/ on a droplet, or add a managed database.
name: parasol
region: nyc
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: Ry4nk1m/HopHacks-26
      branch: neighborhood-missions
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-3.6-flash
      - key: ELEVENLABS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ELEVENLABS_VOICE_ID
        scope: RUN_TIME
        value: hpp4J3VqNfWAUOO0d1Us
      - key: DEV_TOOLS
        scope: RUN_TIME
        value: "0"
      - key: ADMIN_KEY
        scope: RUN_TIME
        type: SECRET
